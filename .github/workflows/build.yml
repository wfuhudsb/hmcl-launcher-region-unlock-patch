name: build-and-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build patched jar
        run: bash scripts/build.sh

      - name: Smoke test
        run: |
          HMCL_VERSION="$(tr -d '[:space:]' < HMCL_VERSION)"
          JAR="dist/HMCL-${HMCL_VERSION}-patched.jar"
          unzip -tq "$JAR" > /dev/null
          cat > Smoke.java <<'EOF'
          public class Smoke {
            public static void main(String[] a) throws Exception {
              Class<?> c = Class.forName("org.jackhuang.hmcl.util.RegionUtils");
              boolean m = (boolean) c.getMethod("isIsChinaMainlandMachine").invoke(null);
              boolean n = (boolean) c.getMethod("isIsChinaMainlandNetwork").invoke(null);
              if (m || n) { System.out.println("SMOKE FAIL"); System.exit(1); }
              System.out.println("SMOKE OK");
            }
          }
          EOF
          java -cp "$JAR" Smoke.java

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-jar
          path: dist/HMCL-*-patched.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HMCL-*-patched.jar
          body: |
            Region-unlocked HMCL jar built by GitHub Actions from the
            official upstream release. See the **Build** section of
            the README to build and verify it yourself — recommended if you
            don't want to trust prebuilt binaries.

            For personal study / research use only — see README disclaimer.
